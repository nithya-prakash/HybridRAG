name: rag-knowledge-assistant

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.1
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local LLM server for CHAT_PROVIDER=ollama (the default — see
  # app/core/config.py). No API key, fully self-contained; the tradeoff is
  # `ollama-init` below pulling a multi-GB model on first boot only (cached
  # in the ollama_data volume after that, so every boot after the first is
  # fast) — see README.md § Quickstart for what to expect timing-wise.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # One-shot: pulls the chat model into the `ollama` service above, then
  # exits 0. backend/celery-worker both wait on this succeeding, the same
  # `service_completed_successfully` pattern docker-compose.prod.yml's
  # `migrate` service uses — so `docker compose up` alone is enough, no
  # separate manual `ollama pull` step.
  ollama-init:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: ollama:11434
    command: ["pull", "${OLLAMA_CHAT_MODEL:-llama3.2:3b}"]
    depends_on:
      ollama:
        condition: service_healthy

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    restart: unless-stopped
    # .env.example first (tracked, safe placeholder defaults), then the
    # operator's own .env second — `env_file` lists apply in order, later
    # files winning, so real secrets (OPENAI_API_KEY etc.) belong only in
    # .env, which is gitignored. `required: false` on .env means a fresh
    # clone that hasn't run `cp backend/.env.example backend/.env` yet still
    # starts (with the placeholder key) instead of a hard failure.
    env_file:
      - ../backend/.env.example
      - path: ../backend/.env
        required: false
    environment:
      ENVIRONMENT: local
      POSTGRES_URL: postgresql+asyncpg://rag:rag@postgres:5432/rag
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434
      CORS_ORIGINS: '["http://localhost:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

  celery-worker:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    restart: unless-stopped
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info"]
    # .env.example first (tracked, safe placeholder defaults), then the
    # operator's own .env second — `env_file` lists apply in order, later
    # files winning, so real secrets (OPENAI_API_KEY etc.) belong only in
    # .env, which is gitignored. `required: false` on .env means a fresh
    # clone that hasn't run `cp backend/.env.example backend/.env` yet still
    # starts (with the placeholder key) instead of a hard failure.
    env_file:
      - ../backend/.env.example
      - path: ../backend/.env
        required: false
    environment:
      ENVIRONMENT: local
      POSTGRES_URL: postgresql+asyncpg://rag:rag@postgres:5432/rag
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - uploads_data:/data/uploads
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.core.celery_app inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      HOSTNAME: "0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
  uploads_data:
  ollama_data:
